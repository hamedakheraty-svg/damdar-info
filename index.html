<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جستجوی اطلاعات دامدار</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f7a4d">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دامدار">
<link rel="stylesheet" href="./common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐄 جستجوی اطلاعات دامدار</h1>
    <p>مرکز واکسیناسیون دامپزشکی دکتر آخرتی</p>
  </header>

  <div class="card">
    <label>جستجو بر اساس نام، نام خانوادگی، کد ملی یا موبایل</label>
    <input type="text" id="searchInput" placeholder="مثلاً: احمدی یا 09123456789">
    <button class="btn-primary" onclick="doSearch()">جستجو</button>
    <div class="status" id="searchStatus"></div>
  </div>
  <div id="searchResults"></div>
</div>

<script src="./common.js"></script>
<script>
async function doSearch(){
  const q = document.getElementById("searchInput").value.trim();
  const statusEl = document.getElementById("searchStatus");
  const resultsEl = document.getElementById("searchResults");
  await performSearch(q, statusEl, resultsEl, false);
}

/* ثبت Service Worker برای نصب و کارکرد آفلاین (PWA) */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
